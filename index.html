<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>TikTok 无水印下载</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
:root {
  --pink: #FE2C55; --cyan: #25F4EE; --bg: #08080e;
  --card: rgba(255,255,255,.055); --line: rgba(255,255,255,.11);
  --text: #f5f3ef; --muted: rgba(245,243,239,.62); --faint: rgba(245,243,239,.38);
}
body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; min-height: 100vh; padding-bottom: env(safe-area-inset-bottom); }

html{ background:#08080e; }
.bg{ position:fixed; inset:0; z-index:-2; overflow:hidden; pointer-events:none; background:radial-gradient(120% 90% at 50% 0%, #17121f 0%, #08080e 55%); }
.orb{ position:absolute; border-radius:50%; filter:blur(70px); opacity:.5; }
.orb-a{ width:340px; height:340px; left:-90px; top:-70px; background:radial-gradient(circle at 35% 35%, #ff6a1f, #FE2C55 70%); animation:drift 16s ease-in-out infinite alternate; }
.orb-b{ width:280px; height:280px; right:-80px; top:180px; background:radial-gradient(circle at 60% 40%, #7a2bff, #2b1055 75%); opacity:.32; animation:drift 21s ease-in-out infinite alternate-reverse; }
.orb-c{ width:220px; height:220px; left:32%; bottom:-110px; background:radial-gradient(circle at 50% 50%, #ff6a1f, #571f00 75%); opacity:.26; animation:drift 19s ease-in-out infinite alternate; }
@keyframes drift{ from{ transform:translate(0,0) scale(1); } to{ transform:translate(38px,26px) scale(1.08); } }
.grain{ position:fixed; inset:0; z-index:-1; pointer-events:none; opacity:.5; background-image:radial-gradient(rgba(255,255,255,.05) 1px, transparent 1px); background-size:22px 22px; }

.container { max-width: 520px; margin: 0 auto; padding: 20px 16px 40px; }
header { text-align: center; padding: 30px 0 18px; }
header h1 { font-size: 28px; font-weight: 900; letter-spacing: 1px; }
header h1 .tk { color: var(--cyan); }
header h1 .dl { background: linear-gradient(92deg, #ff7a92, var(--pink) 60%, #a12bf7); -webkit-background-clip: text; background-clip: text; color: transparent; }
header p { color: var(--muted); font-size: 13px; margin-top: 8px; }
.card { background: var(--card); border-radius: 20px; padding: 18px 16px; margin-top: 16px; border: 1px solid var(--line); box-shadow: 0 24px 50px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.07); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
textarea { width: 100%; min-height: 76px; background: rgba(0,0,0,.32); border: 1px solid rgba(255,255,255,.09); border-radius: 14px; color: var(--text); font-size: 14px; padding: 12px; resize: none; outline: none; font-family: inherit; transition: border-color .2s, box-shadow .2s; }
textarea:focus { border-color: var(--pink); box-shadow: 0 0 0 4px rgba(255,255,255,.06); }
textarea::placeholder { color: var(--faint); }
.row { display: flex; gap: 10px; margin-top: 10px; }
.btn { border: none; border-radius: 14px; font-size: 15px; font-weight: 600; padding: 13px 0; cursor: pointer; color: #fff; transition: transform .08s, opacity .2s; }
.btn:active { transform: scale(.97); }
.btn-ghost { flex: 1; background: rgba(255,255,255,.07); border: 1px solid var(--line); color: var(--muted); }
.btn-main { width: 100%; margin-top: 12px; font-size: 17px; font-weight: 800; letter-spacing: 1px; padding: 15px 0; background: linear-gradient(92deg, #ff7a92, var(--pink) 55%, #a12bf7); box-shadow: 0 14px 30px rgba(254,44,85,.32), inset 0 1px 0 rgba(255,255,255,.3); }
.btn-main:disabled { opacity: .5; box-shadow: none; }
.dlprog{ display:none; margin-top:12px; }
.dlprog .track{ height:10px; border-radius:6px; background:rgba(255,255,255,.1); overflow:hidden; }
.dlprog .bar{ height:100%; width:0%; border-radius:6px; background:linear-gradient(90deg,var(--pink),var(--cyan)); transition:width .15s; }
.dlprog .txt{ margin-top:6px; font-size:12px; color:var(--muted); text-align:center; }
.btn-dl { width: 100%; margin-top: 10px; background: linear-gradient(135deg, #1da1f2, var(--cyan)); color: #04222a; box-shadow: 0 10px 22px rgba(37,244,238,.18); }
.btn-dl.hd { background: linear-gradient(135deg, #a855f7, #ec4899); color: #fff; box-shadow: 0 10px 22px rgba(168,85,247,.25); }
.btn-sub { flex: 1; background: rgba(255,255,255,.07); border: 1px solid var(--line); color: var(--muted); font-size: 14px; padding: 11px 0; }
#loading { display: none; text-align: center; padding: 28px 0; color: var(--muted); }
.spinner { width: 36px; height: 36px; margin: 0 auto 12px; border: 3px solid rgba(255,255,255,.12); border-top-color: var(--pink); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
#errorMsg { display: none; margin-top: 16px; background: rgba(254,44,85,.12); border: 1px solid rgba(254,44,85,.4); color: #ff9db0; border-radius: 14px; padding: 12px 14px; font-size: 14px; line-height: 1.6; }
#result { display: none; }
#preview { width: 100%; max-height: 60vh; border-radius: 14px; background: #000; display: block; }
.meta { padding: 12px 2px 4px; }
.meta .title { font-size: 15px; font-weight: 600; line-height: 1.5; }
.meta .author { color: var(--muted); font-size: 13px; margin-top: 6px; }
#imgGrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
#imgGrid .img-item { position: relative; border-radius: 12px; overflow: hidden; background: #000; }
#imgGrid img { width: 100%; display: block; aspect-ratio: 3/4; object-fit: cover; }
#imgGrid button { position: absolute; bottom: 8px; right: 8px; background: rgba(0,0,0,.65); color: #fff; border: 1px solid rgba(255,255,255,.25); border-radius: 20px; font-size: 12px; padding: 6px 12px; cursor: pointer; }
.hint { margin-top: 12px; font-size: 12px; color: var(--muted); line-height: 1.7; background: rgba(37,244,238,.06); border: 1px solid rgba(37,244,238,.2); border-radius: 12px; padding: 10px 12px; }
footer { text-align: center; color: var(--faint); font-size: 12px; margin-top: 28px; line-height: 1.8; }
footer a { color: var(--cyan); text-decoration: none; }
#fbBtn { position: fixed; right: 16px; bottom: calc(24px + env(safe-area-inset-bottom)); z-index: 40; width: 52px; height: 52px; border-radius: 50%; border: 1px solid rgba(255,255,255,.25); font-size: 22px; color: #fff; background: linear-gradient(135deg, #ff7a92, var(--pink) 60%, #a12bf7); box-shadow: 0 12px 28px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.35); cursor: pointer; touch-action: none; user-select: none; -webkit-user-select: none; }
#fbWrap { display: none; position: fixed; inset: 0; z-index: 50; }
#fbWrap.show { display: block; }
#fbWrap .backdrop { position: absolute; inset: 0; background: rgba(4,4,8,.62); backdrop-filter: blur(3px); }
#fbWrap .sheet { position: absolute; left: 0; right: 0; bottom: 0; background: linear-gradient(180deg,#1b1b26,#12121c); border: 1px solid rgba(255,255,255,.1); border-bottom: none; border-radius: 24px 24px 0 0; padding: 18px 18px calc(20px + env(safe-area-inset-bottom)); max-width: 520px; margin: 0 auto; max-height: 88vh; overflow-y: auto; }
#fbWrap .sheet h3 { font-size: 17px; margin-bottom: 6px; }
#fbWrap .sheet p { font-size: 13px; color: var(--muted); line-height: 1.7; margin-bottom: 12px; }
#fbWrap textarea { min-height: 100px; }
#fbWrap input[type=text] { width: 100%; background: rgba(0,0,0,.32); border: 1px solid rgba(255,255,255,.1); border-radius: 12px; color: var(--text); font-size: 14px; padding: 12px; outline: none; margin-top: 10px; }
#fbWrap input[type=text]:focus { border-color: var(--pink); }
#fbWrap input[type=file] { margin-top: 8px; font-size: 13px; color: var(--muted); }
#fbWrap .flabel { display: block; margin-top: 10px; font-size: 13px; color: var(--muted); }
#fbWrap .row { display: flex; gap: 10px; margin-top: 14px; }
#fbWrap .btn-ghost { flex: 1; }
#fbWrap .btn-ok { flex: 2; border: none; border-radius: 12px; font-size: 15px; font-weight: 600; padding: 13px 0; color: #fff; cursor: pointer; background: linear-gradient(92deg, #ff7a92, var(--pink) 55%, #a12bf7); }
#fbWrap .btn-ok:disabled { opacity: .5; }
#fbDone { display: none; text-align: center; padding: 20px 0 6px; }
#fbDone .big { font-size: 40px; }
#fbDone p { margin-top: 10px; }

.btn-main{ position:relative; overflow:hidden; }
.btn-main::after{ content:""; position:absolute; top:0; left:-70%; width:45%; height:100%; background:linear-gradient(100deg,transparent,rgba(255,255,255,.32),transparent); transform:skewX(-18deg); animation:shine 3.4s ease-in-out infinite; pointer-events:none; }
@keyframes shine{ 0%,55%{ left:-70%; } 85%,100%{ left:130%; } }

</style>
</head>
<body>
<div class="bg"><div class="orb orb-a"></div><div class="orb orb-b"></div><div class="orb orb-c"></div></div><div class="grain"></div>
<div class="container">
  <header>
    <h1><span class="tk">TikTok</span> <span class="dl">无水印下载</span></h1>
    <p>粘贴分享链接，一键保存无水印视频 / 图片</p>
    <p style="font-size:12px;color:var(--muted)">本站已解析 <b id="parseCount" style="color:var(--pink)">-</b> 次</p>
    <p style="font-size:12px;color:var(--muted)">今日还可解析 <b id="quotaCount" style="color:var(--pink)">-</b> 次</p>
  </header>

  <div class="card">
    <textarea id="urlInput" placeholder="在此粘贴 TikTok 分享链接，例如：&#10;https://vt.tiktok.com/xxxxx/&#10;https://www.tiktok.com/@xxx/video/xxxxx"></textarea>
    <div class="row">
      <button class="btn btn-ghost" id="pasteBtn">📋 粘贴</button>
      <button class="btn btn-ghost" id="clearBtn">🗑 清空</button>
    </div>
    <button class="btn btn-main" id="parseBtn">⚡ 解析下载</button>
    <div id="tsParseWidget" style="margin-top:10px"></div>
  </div>

  <div id="loading"><div class="spinner"></div>正在解析，请稍候…</div>
  <div id="errorMsg"></div>

  <div class="card" id="result">
    <video id="preview" controls playsinline preload="metadata" referrerpolicy="no-referrer" style="display:none"></video>
    <div class="meta">
      <div class="title" id="vTitle"></div>
      <div class="author" id="vAuthor"></div>
    </div>
    <div id="videoBtns" style="display:none">
      <button class="btn btn-dl" id="dlBtn">⬇ 下载无水印视频</button>
      <div class="dlprog" id="dlProg">
        <div class="track"><div class="bar" id="dlProgBar"></div></div>
        <div class="txt" id="dlProgTxt">准备下载…</div>
      </div>
      <button class="btn btn-dl hd" id="dlHdBtn" style="display:none">⬇ 下载高清视频</button>
      <div class="row">
        <button class="btn btn-sub" id="coverBtn">🖼 封面</button>
        <button class="btn btn-sub" id="musicBtn">🎵 音乐</button>
      </div>
    </div>
    <div id="imgGrid" style="display:none"></div>
    <div class="hint" id="iosHint" style="display:none">
      🍎 iPhone 用户：点"下载"会自动尝试保存；若不成功，<b>长按上方视频 → 保存到照片</b>，同样是无水印原视频，这是最稳的方法。
    </div>
  </div>

  <footer>
    仅供个人学习交流，请勿用于商业用途
  </footer>
</div>

<!-- 反馈 -->
<button id="fbBtn" title="问题反馈">💬</button>
<div id="fbWrap">
  <div class="backdrop" id="fbBackdrop"></div>
  <div class="sheet" id="fbSheet">
    <h3>问题反馈</h3>
    <p>遇到解析失败、下载不了等问题？描述一下，可以附截图或录屏。</p>
    <textarea id="fbMsg" placeholder="请描述你遇到的问题（比如：哪条链接解析失败、报了什么错）"></textarea>
    <input type="text" id="fbContact" placeholder="联系方式（可选）" maxlength="120">
    <label class="flabel" for="fbFiles">📎 截图/录屏（可选，最多3个，单个≤20MB）</label>
    <input type="file" id="fbFiles" accept="image/*,video/*" multiple>
    <div id="tsWidget" style="margin-top:10px"></div>
    <div class="row">
      <button class="btn btn-ghost" id="fbCancel">取消</button>
      <button class="btn-ok" id="fbSubmit">提交反馈</button>
    </div>
    <div id="fbDone"><div class="big">✅</div><p>反馈已提交，谢谢！</p></div>
  </div>
</div>

<script>
(function(){
  "use strict";
  var $ = function(id){ return document.getElementById(id); };
// 设备ID（防换IP刷次数）：首次访问生成，存 localStorage
var deviceId = (function(){
  try {
    var id = localStorage.getItem('device_id');
    if (!id) {
      id = 'd' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
      localStorage.setItem('device_id', id);
    }
    return id;
  } catch(e){ return ''; }
})();

  var urlInput = $('urlInput'), parseBtn = $('parseBtn'),
      loading = $('loading'), errorMsg = $('errorMsg'), result = $('result');

  // 走本站 Cloudflare Pages 函数代理，避免直连被拦截
  var API = '/api/parse?url=';

  function showError(msg){
    errorMsg.style.display = 'block';
    errorMsg.innerHTML = msg;
    loading.style.display = 'none';
    result.style.display = 'none';
    resetParseBtn();
  }
  function hideError(){ errorMsg.style.display = 'none'; errorMsg.innerHTML = ''; }

  $('pasteBtn').onclick = function(){
    if (navigator.clipboard && navigator.clipboard.readText) {
      navigator.clipboard.readText().then(function(t){ urlInput.value = t.trim(); })
        .catch(function(){ showError('无法读取剪贴板，请手动长按粘贴。'); });
    } else { showError('当前浏览器不支持一键粘贴，请手动长按粘贴。'); }
  };
  $('clearBtn').onclick = function(){ urlInput.value=''; hideError(); result.style.display='none'; };

  function dlProxy(url, filename){
    return '/api/dl?url=' + encodeURIComponent(url) + '&filename=' + encodeURIComponent(filename);
  }

  // —— 下载核心：手机直连 TikTok（住宅 IP 不会被拦），多地址依次尝试 ——
  // 第1层：fetch + Web Share（一键分享保存，最顺滑）
  // 失败则高亮预览视频，引导长按保存（iOS 系统级能力，一定可用）
  function fetchBlobProgress(url, onProgress, fetchOpts){
    return fetch(url, fetchOpts || {}).then(function(res){
      if(!res.ok) throw new Error('HTTP ' + res.status);
      var total = parseInt(res.headers.get('Content-Length') || '0', 10) || 0;
      var ctype = res.headers.get('Content-Type') || 'video/mp4';
      if(!res.body || !res.body.getReader) return res.blob();
      var reader = res.body.getReader();
      var chunks = [];
      var received = 0;
      onProgress(0, total);
      function pump(){
        return reader.read().then(function(r){
          if(r.done){
            try{ reader.releaseLock(); }catch(e){}
            return new Blob(chunks, { type: ctype });
          }
          chunks.push(r.value);
          received += r.value.byteLength || r.value.length || 0;
          onProgress(received, total);
          return pump();
        });
      }
      return pump();
    });
  }
  function fmtMB(b){ return (b/1048576).toFixed(1) + ' MB'; }
  function setDlProg(received, total){
    var wrap = document.getElementById('dlProg');
    if(!wrap) return;
    var bar = document.getElementById('dlProgBar');
    var txt = document.getElementById('dlProgTxt');
    wrap.style.display = 'block';
    if(total > 0){
      var pct = Math.min(100, Math.round(received / total * 100));
      bar.style.width = pct + '%';
      bar.style.opacity = '';
      txt.textContent = '下载中 ' + pct + '%（' + fmtMB(received) + ' / ' + fmtMB(total) + '）';
    }else{
      bar.style.width = '100%';
      bar.style.opacity = '.4';
      txt.textContent = '下载中，已接收 ' + fmtMB(received) + '…';
    }
  }
  function resetDlProg(){
    var wrap = document.getElementById('dlProg');
    if(!wrap) return;
    document.getElementById('dlProgBar').style.width = '0%';
    document.getElementById('dlProgBar').style.opacity = '';
    document.getElementById('dlProgTxt').textContent = '准备下载…';
    wrap.style.display = 'block';
  }
  function hideDlProg(){ var w = document.getElementById('dlProg'); if(w) w.style.display = 'none'; }

  function downloadFile(url, filename, altUrls){
    var urls = [url].concat(altUrls || []);
    var idx = 0;
    setParseBtn('正在准备下载…', true);

    function tryNext(){
      if(idx >= urls.length){
        resetParseBtn();
        // 全部直连失败：显示每个地址的具体错误，方便排查
        var preview = $('preview');
        if(preview){
          preview.scrollIntoView({ behavior: 'smooth', block: 'center' });
          preview.style.boxShadow = '0 0 0 3px var(--pink)';
          setTimeout(function(){ preview.style.boxShadow = 'none'; }, 3000);
        }
        showError('一键下载失败，各地址错误如下：<br>' + errLog.join('<br>') +
          '<br><br>请<b>长按上方视频 → 保存到照片</b>，即可保存无水印视频到相册。');
        return;
      }
      var u = urls[idx++];
      var shortUrl = u.length > 60 ? u.substring(0, 60) + '...' : u;
      resetDlProg();
      fetchBlobProgress(u, setDlProg, { referrerPolicy: 'no-referrer' }).then(function(blob){
        hideDlProg();
        var file = new File([blob], filename, { type: blob.type || 'video/mp4' });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          resetParseBtn();
          return navigator.share({ files: [file], title: filename }).catch(function(){});
        }
        var objUrl = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = objUrl; a.download = filename;
        document.body.appendChild(a); a.click();
        setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(objUrl); }, 4000);
        resetParseBtn();
        hideDlProg();
      }).catch(function(e){
        hideDlProg();
        errLog.push('地址' + idx + ' (' + shortUrl + '): ' + (e.message || '网络错误'));
        tryNext(); // 这个地址不行，试下一个
      });
    }
    var errLog = [];
    tryNext();
  }

  function setParseBtn(t, disabled){
    parseBtn.textContent = t;
    parseBtn.disabled = !!disabled;
  }
  function resetParseBtn(){
    parseBtn.textContent = '⚡ 解析下载';
    parseBtn.disabled = false;
  }

  function fileName(base, ext){ return 'tiktok_' + base + '.' + ext; }

  parseBtn.onclick = function(){
    var url = urlInput.value.trim();
    hideError();
    if(!url){ showError('请先粘贴 TikTok 分享链接。'); return; }
    if(!/tiktok\.com|vt\.tiktok|vm\.tiktok|tiktokv\.com/.test(url)){
      showError('链接看起来不像 TikTok 分享链接，请检查后重试。');
      return;
    }
    var tsToken = '';
    if (tsParseWidgetId !== null) {
      tsToken = turnstile.getResponse(tsParseWidgetId) || '';
      if (!tsToken) { showError('请先完成人机验证。'); return; }
    }
    loading.style.display = 'block';
    result.style.display = 'none';
    setParseBtn('解析中…', true);

    var apiUrl = API + encodeURIComponent(url);
    if (typeof deviceId !== 'undefined' && deviceId) apiUrl += '&deviceId=' + encodeURIComponent(deviceId);
    if (tsToken) apiUrl += '&turnstile=' + encodeURIComponent(tsToken);
    fetch(apiUrl)
      .then(function(r){
        return r.text().then(function(t){
          var j;
          try { j = JSON.parse(t); }
          catch(e){ throw new Error('服务器返回异常，可能是网络被拦截，请稍后重试'); }
          if(j.code !== 0 || !j.data){ throw new Error(j.msg || '解析失败'); }
          return j.data;
        });
      })
      .then(function(data){
        loading.style.display = 'none';
        resetParseBtn();
        renderResult(data);
        // 解析成功，本站计数 +1
        try {
          var el = $('parseCount');
          var n = parseInt(el.textContent, 10);
          if (!isNaN(n)) el.textContent = n + 1;
        } catch(e){}
        try { refreshQuota(); } catch(e){}
      })
      .catch(function(e){
        loading.style.display = 'none';
        showError('解析失败：' + (e.message || '网络错误') + '<br>请确认链接有效，或稍后重试。');
      })
      .finally(function(){
        if (tsParseWidgetId !== null) { try { turnstile.reset(tsParseWidgetId); } catch(e){} }
      });
  };
  /* 解析区 Turnstile（页面加载时渲染；没配 key 则不显示，直接解析） */
  var tsParseWidgetId = null;
  /* 本站解析次数 */
  fetch('/api/stats').then(function(r){ return r.json(); }).then(function(j){
    if (j.ok && typeof j.parseCount === 'number') $('parseCount').textContent = j.parseCount;
  }).catch(function(){});
  (function loadParseTurnstile(){
    fetch('/api/turnstile-key').then(function(r){ return r.json(); }).then(function(j){
      if (!j.siteKey) return;
      var s = document.createElement('script');
      s.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js';
      s.async = true; s.defer = true;
      s.onload = function(){
        tsParseWidgetId = turnstile.render('#tsParseWidget', { sitekey: j.siteKey, theme: 'dark', language: 'zh-cn' });
      };
      document.head.appendChild(s);
    }).catch(function(){});
  })();

  function renderResult(d){
    result.style.display = 'block';
    $('vTitle').textContent = d.title || 'TikTok 视频';
    var author = (d.author && d.author.nickname) ? d.author.nickname : '';
    var dur = d.duration ? ' · ' + d.duration + 's' : '';
    $('vAuthor').textContent = (author ? '@' + author : '') + dur;

    var isImagePost = d.images && d.images.length > 0;
    $('videoBtns').style.display = isImagePost ? 'none' : 'block';
    $('imgGrid').style.display = isImagePost ? 'grid' : 'none';
    $('preview').style.display = isImagePost ? 'none' : 'block';
    $('iosHint').style.display = 'block';

    if(isImagePost){
      var grid = $('imgGrid'); grid.innerHTML = '';
      d.images.forEach(function(src, i){
        var div = document.createElement('div');
        div.className = 'img-item';
        var img = document.createElement('img');
        img.src = src; img.loading = 'lazy'; img.alt = '图片 ' + (i+1);
        img.referrerPolicy = 'no-referrer';
        var btn = document.createElement('button');
        btn.textContent = '⬇ 下载';
        btn.onclick = function(){ downloadFile(src, fileName(d.id + '_' + (i+1), 'jpg')); };
        div.appendChild(img); div.appendChild(btn);
        grid.appendChild(div);
      });
    } else {
      var preview = $('preview');
      preview.src = d.play;
      preview.poster = d.cover || d.origin_cover || '';
      $('dlBtn').onclick = function(){ downloadFile(d.play, fileName(d.id, 'mp4'), d.play_alts); };
      if(d.hdplay){
        $('dlHdBtn').style.display = 'block';
        $('dlHdBtn').onclick = function(){ downloadFile(d.hdplay, fileName(d.id + '_hd', 'mp4')); };
      } else { $('dlHdBtn').style.display = 'none'; }
      $('coverBtn').onclick = function(){
        downloadFile(d.origin_cover || d.cover, fileName(d.id + '_cover', 'jpg'));
      };
      $('musicBtn').onclick = function(){
        if(d.music) downloadFile(d.music, fileName(d.id + '_music', 'mp3'));
        else showError('该视频没有可下载的音乐。');
      };
    }
    result.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
  /* 反馈表单 */
  var tsWidgetId = null; // Turnstile 组件 id（没配 key 时为 null，直接提交）
  function loadTurnstile(){
    if (tsWidgetId !== null || window.turnstileLoading) return;
    window.turnstileLoading = true;
    fetch('/api/turnstile-key').then(function(r){ return r.json(); }).then(function(j){
      if (!j.siteKey) return;
      var s = document.createElement('script');
      s.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js';
      s.async = true; s.defer = true;
      s.onload = function(){
        tsWidgetId = turnstile.render('#tsWidget', { sitekey: j.siteKey, theme: 'dark', language: 'zh-cn' });
      };
      document.head.appendChild(s);
    }).catch(function(){});
  }
  $('fbBtn').onclick = function(){ $('fbWrap').classList.add('show'); $('fbDone').style.display = 'none'; loadTurnstile(); };
  $('fbBackdrop').onclick = function(){ $('fbWrap').classList.remove('show'); };
  $('fbCancel').onclick = function(){ $('fbWrap').classList.remove('show'); };
  $('fbSubmit').onclick = async function(){
    const msg = $('fbMsg').value.trim();
    if(!msg){ showError('请先填写反馈内容。'); return; }
    const files = Array.from($('fbFiles').files || []);
    if(files.length > 3){ showError('最多上传 3 个附件。'); return; }
    for(const f of files){
      if(!/^(image|video)\//.test(f.type || '')){ showError('只支持图片和视频附件。'); return; }
      if(f.size > 20 * 1024 * 1024){ showError('单个附件不能超过 20MB。'); return; }
    }
    let tsToken = '';
    if (tsWidgetId !== null) {
      tsToken = turnstile.getResponse(tsWidgetId) || '';
      if (!tsToken) { showError('请先完成人机验证。'); return; }
    }
    const btn = $('fbSubmit');
    btn.disabled = true; btn.textContent = '提交中…';
    try{
      const fd = new FormData();
      fd.append('message', msg);
      fd.append('contact', $('fbContact').value.trim());
      fd.append('page', location.href);
      if (tsToken) fd.append('cf-turnstile-response', tsToken);
      files.forEach(function(f){ fd.append('files', f, f.name); });
      const r = await fetch('/api/feedback', { method: 'POST', body: fd });
      const j = await r.json();
      if(j.ok){
        $('fbMsg').value = ''; $('fbContact').value = ''; $('fbFiles').value = '';
        $('fbDone').style.display = 'block';
        setTimeout(function(){ $('fbWrap').classList.remove('show'); }, 1600);
      } else {
        showError('反馈提交失败：' + (j.error || '请稍后重试'));
      }
    }catch(e){ showError('网络错误，请稍后重试。'); }
    if (tsWidgetId !== null) { try { turnstile.reset(tsWidgetId); } catch(e){} }
    btn.disabled = false; btn.textContent = '提交反馈';
  };
})();

// 每日解析配额显示
function refreshQuota(){
  var el = document.getElementById('quotaCount');
  if (!el) return;
  var qurl = '/api/parse-quota';
  try {
    var did = localStorage.getItem('device_id');
    if (did) qurl += '?deviceId=' + encodeURIComponent(did);
  } catch(e){}
  fetch(qurl).then(function(r){ return r.json(); }).then(function(j){
    if (j && j.ok && typeof j.remaining === 'number') el.textContent = j.remaining;
  }).catch(function(){});
}
refreshQuota();
</script>



<script>
/* 可拖动反馈按钮（与快手站同款）：点按打开反馈（原有逻辑不变），按住拖动换位，松手自动贴边，位置会记住 */
(function(){
  var btn = document.getElementById('fbBtn');
  if(!btn) return;
  var KEY = 'fab_pos_tiktok';
  function clamp(x, y){ return { x: Math.min(Math.max(4, x), window.innerWidth - 56), y: Math.min(Math.max(4, y), window.innerHeight - 56) }; }
  try {
    var saved = JSON.parse(localStorage.getItem(KEY) || 'null');
    if(saved && typeof saved.x === 'number' && typeof saved.y === 'number'){
      var p = clamp(saved.x, saved.y);
      btn.style.left = p.x + 'px'; btn.style.top = p.y + 'px'; btn.style.right = 'auto'; btn.style.bottom = 'auto';
    }
  } catch(e){}
  var sx=0, sy=0, ox=0, oy=0, moved=false, dragging=false, dragEndAt=0;
  document.addEventListener('click', function(e){
    if(e.target === btn && moved && Date.now() - dragEndAt < 300){ e.stopPropagation(); e.preventDefault(); }
  }, true);
  btn.addEventListener('pointerdown', function(e){
    dragging = true; moved = false;
    var r = btn.getBoundingClientRect();
    ox = r.left; oy = r.top; sx = e.clientX; sy = e.clientY;
    try{ btn.setPointerCapture(e.pointerId); }catch(err){}
  });
  btn.addEventListener('pointermove', function(e){
    if(!dragging) return;
    var dx = e.clientX - sx, dy = e.clientY - sy;
    if(Math.abs(dx) + Math.abs(dy) > 6) moved = true;
    if(!moved) return;
    var p = clamp(ox + dx, oy + dy);
    btn.style.left = p.x + 'px'; btn.style.top = p.y + 'px'; btn.style.right = 'auto'; btn.style.bottom = 'auto';
  });
  function end(){
    if(!dragging) return;
    dragging = false;
    if(!moved) return;
    dragEndAt = Date.now();
    var r = btn.getBoundingClientRect();
    var x = (r.left + r.width/2 < window.innerWidth/2) ? 10 : window.innerWidth - r.width - 10;
    btn.style.transition = 'left .25s ease';
    btn.style.left = x + 'px';
    setTimeout(function(){ btn.style.transition = ''; }, 280);
    try{ localStorage.setItem(KEY, JSON.stringify({ x: x, y: r.top })); }catch(e){}
  }
  btn.addEventListener('pointerup', end);
  btn.addEventListener('pointercancel', end);
})();
</script>
